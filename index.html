<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スライド抽出</title>
<style>
  :root {
    --bg: #0e0e10;
    --surface: #18181c;
    --border: #2a2a30;
    --accent: #7c6dfa;
    --accent-dim: #3d3580;
    --text: #e8e8f0;
    --text-dim: #7a7a8a;
    --danger: #e05c5c;
    --success: #4caf82;
    --radius: 6px;
    --mono: 'JetBrains Mono', 'Fira Mono', monospace;
    --sans: 'Inter', system-ui, sans-serif;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    width: 100%;
    max-width: 760px;
    padding: 48px 24px 32px;
  }

  h1 {
    font-size: 1.7rem;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  h1 span {
    color: var(--accent);
  }

  .sub {
    margin-top: 8px;
    font-size: 0.85rem;
    color: var(--text-dim);
    line-height: 1.6;
  }

  main {
    width: 100%;
    max-width: 760px;
    padding: 0 24px 64px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .dropzone {
    border: 1.5px dashed var(--border);
    border-radius: var(--radius);
    padding: 48px 24px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    position: relative;
  }

  .dropzone:hover,
  .dropzone.drag-over {
    border-color: var(--accent);
    background: rgba(124,109,250,0.05);
  }

  .dropzone input {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }

  .dropzone-icon {
    font-size: 2rem;
    margin-bottom: 12px;
    opacity: 0.5;
  }

  .dropzone-label {
    font-size: 0.95rem;
    color: var(--text-dim);
  }

  .dropzone-label strong {
    color: var(--accent);
    font-weight: 500;
  }

  .file-chosen {
    margin-top: 8px;
    font-size: 0.8rem;
    color: var(--text-dim);
    font-family: var(--mono);
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .panel-title {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
    padding-bottom: 12px;
    margin-bottom: 2px;
  }

  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .setting-label {
    font-size: 0.875rem;
    color: var(--text);
    flex: 1;
    min-width: 0;
  }

  .setting-desc {
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-top: 2px;
    line-height: 1.4;
  }

  .setting-control {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  input[type="range"] {
    -webkit-appearance: none;
    width: 120px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    background: var(--accent);
    border-radius: 50%;
    cursor: pointer;
  }

  .range-val {
    font-family: var(--mono);
    font-size: 0.8rem;
    color: var(--accent);
    min-width: 36px;
    text-align: right;
  }

  .radio-group {
    display: flex;
    gap: 8px;
  }

  .radio-group label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.85rem;
    cursor: pointer;
    padding: 5px 12px;
    border: 1px solid var(--border);
    border-radius: 4px;
    transition: border-color 0.12s, background 0.12s;
  }

  .radio-group input[type="radio"] {
    display: none;
  }

  .radio-group label:has(input:checked) {
    border-color: var(--accent);
    background: rgba(124,109,250,0.12);
    color: var(--accent);
  }

  .btn-row {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .run-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 13px 28px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
  }

  .run-btn:hover:not(:disabled) {
    opacity: 0.88;
  }

  .run-btn:active:not(:disabled) {
    transform: scale(0.98);
  }

  .run-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  .abort-btn {
    background: transparent;
    color: var(--danger);
    border: 1px solid var(--danger);
    border-radius: var(--radius);
    padding: 12px 20px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, opacity 0.15s;
    display: none;
  }

  .abort-btn:hover {
    background: rgba(224,92,92,0.1);
  }

  .abort-btn.visible {
    display: block;
  }

  .abort-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .progress-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
    display: none;
    flex-direction: column;
    gap: 10px;
  }

  .progress-box.visible {
    display: flex;
  }

  .progress-bar-wrap {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    width: 0%;
    transition: width 0.2s;
  }

  .progress-log {
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--text-dim);
    line-height: 1.5;
    max-height: 80px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-all;
  }

  .progress-status {
    font-size: 0.82rem;
    color: var(--text-dim);
  }

  .progress-status strong {
    color: var(--text);
    font-family: var(--mono);
  }

  .result-box {
    display: none;
    flex-direction: column;
    gap: 16px;
  }

  .result-box.visible {
    display: flex;
  }

  .result-stats {
    font-size: 0.85rem;
    color: var(--text-dim);
  }

  .result-stats strong {
    color: var(--text);
  }

  .thumb-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 8px;
  }

  /* still thumbnail — no interaction */
  .thumb-item {
    position: relative;
    aspect-ratio: 16/9;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
  }

  .thumb-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .thumb-item .thumb-label {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(0,0,0,0.65);
    font-family: var(--mono);
    font-size: 0.6rem;
    color: #ccc;
    padding: 2px 5px;
  }

  .thumb-item .thumb-badge {
    position: absolute;
    top: 4px;
    right: 4px;
    font-size: 0.55rem;
    font-weight: 600;
    padding: 1px 5px;
    border-radius: 2px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .badge-still {
    background: var(--accent-dim);
    color: var(--accent);
  }

  .badge-video {
    background: rgba(80,80,80,0.8);
    color: #aaa;
  }

  /* video thumbnail — clickable, opens modal */
  .thumb-item.video-thumb {
    cursor: pointer;
    border: 2.5px solid #e8a020;
    box-shadow: 0 0 0 1px rgba(232,160,32,0.25);
    border-radius: 5px;
  }

  .thumb-item.video-thumb:hover {
    border-color: #f0b830;
    box-shadow: 0 0 10px rgba(232,160,32,0.45);
  }

  .thumb-item.video-thumb .video-edit-hint {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    font-weight: 600;
    color: rgba(255,255,255,0);
    transition: background 0.15s, color 0.15s;
  }

  .thumb-item.video-thumb:hover .video-edit-hint {
    background: rgba(0,0,0,0.45);
    color: #fff;
  }

  .dl-btn {
    background: var(--success);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 12px 24px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
    align-self: flex-start;
  }

  .dl-btn:hover:not(:disabled) {
    opacity: 0.88;
  }

  .dl-btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  .error-box {
    display: none;
    background: rgba(224,92,92,0.1);
    border: 1px solid var(--danger);
    border-radius: var(--radius);
    padding: 14px 18px;
    font-size: 0.85rem;
    color: var(--danger);
    line-height: 1.5;
  }

  .error-box.visible {
    display: block;
  }

  /* ===== Frame-picker modal ===== */
  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .modal-backdrop.open {
    display: flex;
  }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    width: 100%;
    max-width: 700px;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .modal-header {
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-shrink: 0;
  }

  .modal-title {
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--text);
  }

  .modal-sub {
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-top: 3px;
  }

  .modal-close {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 4px;
    padding: 5px 10px;
    cursor: pointer;
    font-size: 0.85rem;
    flex-shrink: 0;
  }

  .modal-close:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .modal-body {
    padding: 16px 20px;
    overflow-y: auto;
    flex: 1;
  }

  .modal-frame-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 8px;
  }

  .modal-frame-item {
    position: relative;
    aspect-ratio: 16/9;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
    cursor: pointer;
    border: 3px solid transparent;
    transition: border-color 0.1s, box-shadow 0.1s, transform 0.08s;
  }

  .modal-frame-item:hover {
    border-color: rgba(124,109,250,0.5);
  }

  .modal-frame-item.selected {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(124,109,250,0.35), 0 4px 14px rgba(124,109,250,0.3);
    transform: scale(0.97);
  }

  .modal-frame-item.selected::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(124,109,250,0.1);
    pointer-events: none;
  }

  .modal-frame-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
  }

  .modal-frame-item .mf-time {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(0,0,0,0.65);
    font-family: var(--mono);
    font-size: 0.6rem;
    color: #ccc;
    padding: 2px 5px;
    pointer-events: none;
  }

  .modal-frame-item .mf-check {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 0.7rem;
    font-weight: 700;
    display: none;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    pointer-events: none;
  }

  .modal-frame-item.selected .mf-check {
    display: flex;
  }

  .modal-footer {
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-shrink: 0;
    flex-wrap: wrap;
  }

  .modal-sel-info {
    font-size: 0.82rem;
    color: var(--text-dim);
  }

  .modal-sel-info strong {
    color: var(--accent);
    font-family: var(--mono);
  }

  .modal-actions {
    display: flex;
    gap: 8px;
  }

  .modal-btn {
    border: none;
    border-radius: var(--radius);
    padding: 10px 18px;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.12s;
  }

  .modal-btn:hover {
    opacity: 0.85;
  }

  .modal-btn.primary {
    background: var(--accent);
    color: #fff;
  }

  .modal-btn.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
  }

  .modal-btn.secondary:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .modal-loading {
    padding: 32px;
    text-align: center;
    color: var(--text-dim);
    font-size: 0.85rem;
  }

  @media (max-width: 500px) {
    h1 {
      font-size: 1.3rem;
    }

    .setting-row {
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }

    input[type="range"] {
      width: 100%;
    }

    .modal {
      max-height: 95vh;
    }
  }
</style>
</head>

<body>
<header>
  <h1>スライド<span>抽出</span></h1>
  <p class="sub">動画内の静止画スライドを1枚ずつ検出してJPEGで保存します。処理はすべてブラウザ内で完結します。</p>
</header>

<main>
  <div class="dropzone" id="dropzone">
    <input type="file" id="fileInput" accept="video/*">
    <div class="dropzone-icon">▶</div>
    <div class="dropzone-label"><strong>クリックして動画を選択</strong>、またはドロップ</div>
    <div class="file-chosen" id="fileChosen"></div>
  </div>

  <div class="panel">
    <div class="panel-title">検出設定</div>

    <div class="setting-row">
      <div class="setting-label">
        フレーム差分閾値
        <div class="setting-desc">基準フレームとの差がこの値を超えたらスライド切り替えと判定（大きくすると寛容）</div>
      </div>
      <div class="setting-control">
        <input type="range" id="threshSlider" min="1" max="30" value="4" step="1">
        <span class="range-val" id="threshVal">4</span>
      </div>
    </div>

    <div class="setting-row">
      <div class="setting-label">
        最小持続フレーム数
        <div class="setting-desc">この枚数以上続いた静止区間のみをスライドとして抽出</div>
      </div>
      <div class="setting-control">
        <input type="range" id="minFramesSlider" min="1" max="60" value="3" step="1">
        <span class="range-val" id="minFramesVal">3</span>
      </div>
    </div>

    <div class="setting-row">
      <div class="setting-label">
        解析フレームレート
        <div class="setting-desc">動画から取り出す頻度（fps）。高いほど精度が上がるが遅くなります</div>
      </div>
      <div class="setting-control">
        <input type="range" id="fpsSlider" min="1" max="15" value="8" step="1">
        <span class="range-val" id="fpsVal">8</span>
      </div>
    </div>

    <div class="setting-row">
      <div class="setting-label">
        ビデオ区間の扱い
        <div class="setting-desc">毎フレーム変化する部分（アニメーション・実写など）の処理</div>
      </div>
      <div class="setting-control">
        <div class="radio-group">
          <label><input type="radio" name="videoMode" value="skip" checked>スキップ</label>
          <label><input type="radio" name="videoMode" value="one">代表フレームを選択</label>
        </div>
      </div>
    </div>
  </div>

  <div class="btn-row">
    <button class="run-btn" id="runBtn" disabled>抽出を開始</button>
    <button class="abort-btn" id="abortBtn">中止</button>
  </div>

  <div class="progress-box" id="progressBox">
    <div class="progress-status">処理中… <strong id="progressLabel">準備中</strong></div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>
    <div class="progress-log" id="progressLog"></div>
  </div>

  <div class="error-box" id="errorBox"></div>

  <div class="result-box" id="resultBox">
    <div class="result-stats" id="resultStats"></div>
    <div class="thumb-grid" id="thumbGrid"></div>
    <button class="dl-btn" id="dlBtn">ZIPでダウンロード</button>
  </div>
</main>

<!-- ===== Frame-picker modal ===== -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="modalTitle">代表フレームを選択</div>
        <div class="modal-sub" id="modalSub"></div>
      </div>
      <button class="modal-close" id="modalClose">✕ 閉じる</button>
    </div>

    <div class="modal-body">
      <div class="modal-loading" id="modalLoading">フレームを読み込み中…</div>
      <div class="modal-frame-grid" id="modalFrameGrid"></div>
    </div>

    <div class="modal-footer">
      <div class="modal-sel-info">
        <strong id="modalSelCount">0</strong> 枚選択中
      </div>
      <div class="modal-actions">
        <button class="modal-btn secondary" id="modalSelectAll">すべて選択</button>
        <button class="modal-btn secondary" id="modalClearSel">選択解除</button>
        <button class="modal-btn primary" id="modalConfirm">この選択で確定</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script>
// ---- DOM refs ----
const dropzone        = document.getElementById('dropzone');
const fileInput       = document.getElementById('fileInput');
const fileChosen      = document.getElementById('fileChosen');
const runBtn          = document.getElementById('runBtn');
const abortBtn        = document.getElementById('abortBtn');
const progressBox     = document.getElementById('progressBox');
const progressFill    = document.getElementById('progressFill');
const progressLabel   = document.getElementById('progressLabel');
const progressLog     = document.getElementById('progressLog');
const errorBox        = document.getElementById('errorBox');
const resultBox       = document.getElementById('resultBox');
const resultStats     = document.getElementById('resultStats');
const thumbGrid       = document.getElementById('thumbGrid');
const dlBtn            = document.getElementById('dlBtn');
const threshSlider    = document.getElementById('threshSlider');
const threshVal       = document.getElementById('threshVal');
const minFramesSlider = document.getElementById('minFramesSlider');
const minFramesVal    = document.getElementById('minFramesVal');
const fpsSlider       = document.getElementById('fpsSlider');
const fpsVal          = document.getElementById('fpsVal');
const modalBackdrop   = document.getElementById('modalBackdrop');
const modalTitle      = document.getElementById('modalTitle');
const modalSub        = document.getElementById('modalSub');
const modalClose      = document.getElementById('modalClose');
const modalLoading    = document.getElementById('modalLoading');
const modalFrameGrid  = document.getElementById('modalFrameGrid');
const modalSelCount   = document.getElementById('modalSelCount');
const modalSelectAll  = document.getElementById('modalSelectAll');
const modalClearSel   = document.getElementById('modalClearSel');
const modalConfirm    = document.getElementById('modalConfirm');

threshSlider.addEventListener('input', () => {
  threshVal.textContent = threshSlider.value;
});

minFramesSlider.addEventListener('input', () => {
  minFramesVal.textContent = minFramesSlider.value;
});

fpsSlider.addEventListener('input', () => {
  fpsVal.textContent = fpsSlider.value;
});

let selectedFile = null;

dropzone.addEventListener('dragover', e => {
  e.preventDefault();
  dropzone.classList.add('drag-over');
});

dropzone.addEventListener('dragleave', () => {
  dropzone.classList.remove('drag-over');
});

dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('drag-over');

  const f = e.dataTransfer.files[0];

  if (f && f.type.startsWith('video/')) {
    setFile(f);
  }
});

fileInput.addEventListener('change', () => {
  if (fileInput.files[0]) {
    setFile(fileInput.files[0]);
  }
});

function setFile(f) {
  selectedFile = f;
  fileChosen.textContent =
    f.name + '  (' + (f.size / 1024 / 1024).toFixed(1) + ' MB)';

  runBtn.disabled = false;
  hideAll();
}

function getSettings() {
  return {
    diffThresh: Number(threshSlider.value),
    minFrames: Number(minFramesSlider.value),
    fps: Number(fpsSlider.value),
    videoMode: document.querySelector('input[name="videoMode"]:checked').value
  };
}

function log(msg) {
  progressLog.textContent += msg + '\n';
  progressLog.scrollTop = progressLog.scrollHeight;
}

function setProgress(pct, label) {
  progressFill.style.width = pct + '%';

  if (label) {
    progressLabel.textContent = label;
  }
}

function showError(msg) {
  errorBox.textContent = msg;
  errorBox.classList.add('visible');
}

function hideAll() {
  resultBox.classList.remove('visible');
  progressBox.classList.remove('visible');
  errorBox.classList.remove('visible');
  thumbGrid.innerHTML = '';
  progressLog.textContent = '';
  setProgress(0);
  extractedBlobs = [];
}

// ---- Luma diff ----
function frameDiff(a, b) {
  const da = a.data;
  const db = b.data;
  const len = da.length;

  let sum = 0;
  let count = 0;

  for (let i = 0; i < len; i += 32) {
    const la = 0.299 * da[i] + 0.587 * da[i + 1] + 0.114 * da[i + 2];
    const lb = 0.299 * db[i] + 0.587 * db[i + 1] + 0.114 * db[i + 2];

    sum += Math.abs(la - lb);
    count++;
  }

  return sum / count;
}

function seekAndCapture(video, canvas, ctx, time) {
  return new Promise((resolve, reject) => {
    const t = Math.max(0, Math.min(time, video.duration - 0.001));

    if (Math.abs(video.currentTime - t) < 0.001) {
      try {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        resolve(ctx.getImageData(0, 0, canvas.width, canvas.height));
      } catch (e) {
        reject(e);
      }

      return;
    }

    const onSeeked = () => {
      video.removeEventListener('seeked', onSeeked);
      video.removeEventListener('error', onError);

      try {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        resolve(ctx.getImageData(0, 0, canvas.width, canvas.height));
      } catch (e) {
        reject(e);
      }
    };

    const onError = () => {
      video.removeEventListener('seeked', onSeeked);
      video.removeEventListener('error', onError);
      reject(new Error('シーク失敗 t=' + t));
    };

    video.addEventListener('seeked', onSeeked, { once: true });
    video.addEventListener('error', onError, { once: true });
    video.currentTime = t;
  });
}

function canvasToBlob(canvas, quality) {
  return new Promise(res => {
    canvas.toBlob(res, 'image/jpeg', quality ?? 0.92);
  });
}

function yieldFrame() {
  return new Promise(r => setTimeout(r, 0));
}

let extractedBlobs = [];

// ---- Abort ----
let abortRequested = false;

abortBtn.addEventListener('click', () => {
  abortRequested = true;
  abortBtn.disabled = true;
  abortBtn.textContent = '中止中…';
});

// =====================================================================
// Main extraction run
// =====================================================================
runBtn.addEventListener('click', async () => {
  if (!selectedFile) return;

  hideAll();
  extractedBlobs = [];
  abortRequested = false;

  const { diffThresh, minFrames, fps, videoMode } = getSettings();

  progressBox.classList.add('visible');
  runBtn.disabled = true;
  abortBtn.classList.add('visible');
  abortBtn.disabled = false;
  abortBtn.textContent = '中止';

  const videoURL = URL.createObjectURL(selectedFile);

  try {
    log('動画を読み込み中…');
    setProgress(2, '動画ロード中');

    const video = document.createElement('video');

    video.src = videoURL;
    video.muted = true;
    video.playsInline = true;
    video.preload = 'metadata';

    await new Promise((res, rej) => {
      video.addEventListener('loadedmetadata', res, { once: true });
      video.addEventListener(
        'error',
        () => rej(new Error('動画を読み込めませんでした')),
        { once: true }
      );
      video.load();
    });

    const duration = video.duration;
    const W = video.videoWidth || 640;
    const H = video.videoHeight || 360;
    const SCALE = Math.min(1, 480 / W);
    const CW = Math.round(W * SCALE);
    const CH = Math.round(H * SCALE);
    const totalFrames = Math.floor(duration * fps);
    const interval = 1 / fps;

    log(`動画長: ${duration.toFixed(1)}s  元解像度: ${W}×${H}`);
    log(`解析解像度: ${CW}×${CH}  FPS: ${fps}  総フレーム数: ${totalFrames}`);

    const canvas = document.createElement('canvas');
    canvas.width = CW;
    canvas.height = CH;

    const ctx = canvas.getContext('2d', {
      willReadFrequently: true
    });

    const outCanvas = document.createElement('canvas');
    outCanvas.width = W;
    outCanvas.height = H;

    const outCtx = outCanvas.getContext('2d');

    setProgress(5, 'フレーム解析中');
    resultBox.classList.add('visible');

    const HYSTERESIS = 3;

    // STILL run state
    let stillTimes = [];
    let bestDiff = Infinity;
    let bestTime = 0;
    let spikeCount = 0;
    let spikeTimes = [];

    // VIDEO run state
    let videoTimes = [];
    let calmCount = 0;
    let calmBuf = [];

    let inStill = false;
    let prevData = null;

    let slideCount = 0;
    let videoSegCount = 0;

    // For "one" mode: collect all video-segment times so the user can pick frames later.
    // videoSegStore[i] = { segIndex, times: number[] }
    const videoSegStore = [];

    // ---- addThumb: returns the div so callers can attach data ----
    function addThumb(canvas, cw, ch, type, labelTime) {
      const tc = document.createElement('canvas');

      tc.width = cw;
      tc.height = ch;

      tc.getContext('2d').drawImage(canvas, 0, 0);

      const dataURL = tc.toDataURL('image/jpeg', 0.45);

      tc.width = 0;
      tc.height = 0;

      const div = document.createElement('div');
      div.className = 'thumb-item';

      const img = document.createElement('img');
      img.src = dataURL;

      const badge = document.createElement('div');
      badge.className =
        'thumb-badge ' +
        (type === 'still' ? 'badge-still' : 'badge-video');
      badge.textContent = type === 'still' ? 'slide' : 'video';

      const lbl = document.createElement('div');
      lbl.className = 'thumb-label';
      lbl.textContent = labelTime.toFixed(1) + 's';

      div.appendChild(img);
      div.appendChild(badge);
      div.appendChild(lbl);

      thumbGrid.appendChild(div);

      return div;
    }

    async function flushStillRun() {
      if (stillTimes.length < minFrames) {
        // Too short — treat as video
        videoTimes.push(...stillTimes);
      } else {
        // bestTimeは現在のstillTimesに含まれる場合だけ採用する。
        // 区間確定後にリセットされた値や、前区間の値は使わない。
        const fallbackTime =
          stillTimes[Math.floor(stillTimes.length / 2)];

        const exportTime =
          Number.isFinite(bestTime) && stillTimes.includes(bestTime)
            ? bestTime
            : fallbackTime;

        await seekAndCapture(video, canvas, ctx, exportTime);

        outCtx.drawImage(video, 0, 0, W, H);

        const blob = await canvasToBlob(outCanvas, 0.92);

        slideCount++;

        const num = String(slideCount).padStart(3, '0');

        const filename =
          `slide_${num}_t${exportTime.toFixed(2)}s.jpg`;

        extractedBlobs.push({
          blob,
          filename,
          type: 'still'
        });

        addThumb(
          canvas,
          CW,
          CH,
          'still',
          exportTime
        );
      }

      stillTimes = [];
      bestDiff = Infinity;
      bestTime = 0;
      spikeCount = 0;
      spikeTimes = [];
    }

    async function flushVideoRun() {
      if (videoTimes.length === 0) return;

      videoSegCount++;

      if (videoMode === 'one') {
        // Store times for post-processing; show a placeholder thumb.
        const midTime =
          videoTimes[Math.floor(videoTimes.length / 2)];

        await seekAndCapture(
          video,
          canvas,
          ctx,
          midTime
        );

        // Don't add to extractedBlobs yet — user will choose frames via modal.
        const segIdx = videoSegCount;
        const times = [...videoTimes];

        videoSegStore.push({
          segIdx,
          times,
          thumbEls: []
        });

        // Placeholder thumb — clickable to open modal.
        const thumbDiv = addThumb(
          canvas,
          CW,
          CH,
          'video',
          midTime
        );

        thumbDiv.classList.add('video-thumb');

        const hint = document.createElement('div');
        hint.className = 'video-edit-hint';
        hint.textContent = 'タップして選択';

        thumbDiv.appendChild(hint);

        // Badge update: show "未選択"
        const badge =
          thumbDiv.querySelector('.thumb-badge');

        badge.textContent = '未選択';
        badge.style.background =
          'rgba(232,160,32,0.25)';
        badge.style.color = '#e8a020';

        const storeEntry =
          videoSegStore[videoSegStore.length - 1];

        storeEntry.thumbEls.push(thumbDiv);

        thumbDiv.addEventListener(
          'click',
          () => openModal(storeEntry)
        );
      }

      videoTimes = [];
      calmCount = 0;
      calmBuf = [];
    }

    // ---- Main loop ----
    for (let i = 0; i <= totalFrames; i++) {
      if (abortRequested) {
        log('中止されました');
        progressLabel.textContent = '中止';
        break;
      }

      const isLast = i === totalFrames;

      if (i % 10 === 0) {
        setProgress(
          5 + (i / totalFrames) * 85,
          `解析中… ${i}/${totalFrames}`
        );

        await yieldFrame();
      }

      if (isLast) {
        if (inStill) {
          stillTimes.push(...spikeTimes);
          await flushStillRun();
        } else {
          videoTimes.push(...calmBuf);
          await flushVideoRun();
        }

        break;
      }

      const t = i * interval;

      const curData =
        await seekAndCapture(
          video,
          canvas,
          ctx,
          t
        );

      if (prevData === null) {
        prevData = curData;
        inStill = true;
        stillTimes = [t];
        bestDiff = 0;
        bestTime = t;
        continue;
      }

      const diff = frameDiff(
        prevData,
        curData
      );

      prevData = curData;

      if (inStill) {
        if (diff < diffThresh) {
          stillTimes.push(
            ...spikeTimes,
            t
          );

          spikeCount = 0;
          spikeTimes = [];

          if (diff < bestDiff) {
            bestDiff = diff;
            bestTime = t;
          }
        } else {
          spikeCount++;
          spikeTimes.push(t);

          if (spikeCount >= HYSTERESIS) {
            await flushVideoRun();
            await flushStillRun();

            inStill = false;

            videoTimes.push(...spikeTimes);

            spikeCount = 0;
            spikeTimes = [];
          }
        }
      } else {
        if (diff < diffThresh) {
          calmCount++;
          calmBuf.push(t);

          if (calmCount >= HYSTERESIS) {
            await flushVideoRun();

            inStill = true;
            stillTimes = [...calmBuf];

            bestDiff = 0;

            bestTime =
              calmBuf[
                Math.floor(
                  calmBuf.length / 2
                )
              ];

            calmCount = 0;
            calmBuf = [];
          }
        } else {
          videoTimes.push(
            ...calmBuf,
            t
          );

          calmCount = 0;
          calmBuf = [];
        }
      }
    }

    if (!abortRequested) {
      setProgress(100, '完了');
    }

    refreshResultStats();

    log(
      `スライド ${slideCount}枚、ビデオ区間 ${videoSegCount}件`
    );

  } catch (e) {
    showError('エラー: ' + e.message);
    log('エラー: ' + e.message);
    console.error(e);
  } finally {
    URL.revokeObjectURL(videoURL);

    runBtn.disabled = false;

    abortBtn.classList.remove('visible');
    abortBtn.disabled = false;
    abortBtn.textContent = '中止';
  }
});

function refreshResultStats() {
  const sCount =
    extractedBlobs.filter(
      b => b.type === 'still'
    ).length;

  const vCount =
    extractedBlobs.filter(
      b => b.type === 'video'
    ).length;

  resultStats.innerHTML =
    `<strong>${extractedBlobs.length}枚</strong> 抽出完了` +
    ` — スライド ${sCount}枚` +
    (vCount > 0
      ? `、ビデオ代表 ${vCount}枚`
      : '');
}

// =====================================================================
// Modal: frame picker for a video segment
// =====================================================================
let modalCurrentSeg = null;
let modalSelectedTimes = new Set();

async function openModal(seg) {
  modalCurrentSeg = seg;

  modalSelectedTimes =
    new Set(seg.chosenTimes || []);

  modalTitle.textContent =
    `ビデオ区間 #${seg.segIdx} — 代表フレームを選択`;

  const tStart = seg.times[0];
  const tEnd =
    seg.times[seg.times.length - 1];

  modalSub.textContent =
    `${tStart.toFixed(1)}s 〜 ${tEnd.toFixed(1)}s（${seg.times.length} フレーム）`;

  modalFrameGrid.innerHTML = '';
  modalLoading.style.display = 'block';

  modalBackdrop.classList.add('open');

  updateModalSelCount();

  // Open a fresh video for seeking inside the modal
  const url =
    URL.createObjectURL(selectedFile);

  const video =
    document.createElement('video');

  video.src = url;
  video.muted = true;
  video.playsInline = true;
  video.preload = 'metadata';

  await new Promise((res, rej) => {
    video.addEventListener(
      'loadedmetadata',
      res,
      { once: true }
    );

    video.addEventListener(
      'error',
      () => rej(new Error('読み込み失敗')),
      { once: true }
    );

    video.load();
  });

  const W = video.videoWidth || 640;
  const H = video.videoHeight || 360;

  const SCALE =
    Math.min(1, 480 / W);

  const CW =
    Math.round(W * SCALE);

  const CH =
    Math.round(H * SCALE);

  const canvas =
    document.createElement('canvas');

  canvas.width = CW;
  canvas.height = CH;

  const ctx =
    canvas.getContext('2d');

  // Sample up to 30 frames for the modal grid
  const MAX = 30;

  let sampleTimes = seg.times;

  if (sampleTimes.length > MAX) {
    const step =
      sampleTimes.length / MAX;

    sampleTimes =
      Array.from(
        { length: MAX },
        (_, i) =>
          seg.times[
            Math.round(i * step)
          ]
      );
  }

  modalLoading.style.display = 'none';

  for (const t of sampleTimes) {
    if (
      !modalBackdrop.classList.contains('open')
    ) {
      break;
    }

    await seekAndCapture(
      video,
      canvas,
      ctx,
      t
    );

    const dataURL =
      canvas.toDataURL(
        'image/jpeg',
        0.55
      );

    const item =
      document.createElement('div');

    item.className =
      'modal-frame-item' +
      (
        modalSelectedTimes.has(t)
          ? ' selected'
          : ''
      );

    item.dataset.time = t;

    const img =
      document.createElement('img');

    img.src = dataURL;

    const timeLbl =
      document.createElement('div');

    timeLbl.className = 'mf-time';
    timeLbl.textContent =
      t.toFixed(1) + 's';

    const check =
      document.createElement('div');

    check.className = 'mf-check';
    check.textContent = '✓';

    item.appendChild(img);
    item.appendChild(timeLbl);
    item.appendChild(check);

    item.addEventListener(
      'click',
      () => {
        const tt =
          Number(item.dataset.time);

        if (
          modalSelectedTimes.has(tt)
        ) {
          modalSelectedTimes.delete(tt);
          item.classList.remove('selected');
        } else {
          modalSelectedTimes.add(tt);
          item.classList.add('selected');
        }

        updateModalSelCount();
      }
    );

    modalFrameGrid.appendChild(item);

    if (
      modalFrameGrid.children.length % 6 === 0
    ) {
      await yieldFrame();
    }
  }

  URL.revokeObjectURL(url);

  // Store the video + canvases so Confirm can re-seek for full-res export
  modalCurrentSeg._modalVideo = video;
  modalCurrentSeg._modalW = W;
  modalCurrentSeg._modalH = H;

  // (video URL is revoked but the video element still has the data buffered for short videos;
  //  for large files we re-open below in confirmModal)
}

function updateModalSelCount() {
  modalSelCount.textContent =
    modalSelectedTimes.size;
}

modalClose.addEventListener(
  'click',
  closeModal
);

modalBackdrop.addEventListener(
  'click',
  e => {
    if (e.target === modalBackdrop) {
      closeModal();
    }
  }
);

function closeModal() {
  modalBackdrop.classList.remove('open');
  modalCurrentSeg = null;
}

modalSelectAll.addEventListener(
  'click',
  () => {
    modalFrameGrid
      .querySelectorAll('.modal-frame-item')
      .forEach(item => {
        item.classList.add('selected');

        modalSelectedTimes.add(
          Number(item.dataset.time)
        );
      });

    updateModalSelCount();
  }
);

modalClearSel.addEventListener(
  'click',
  () => {
    modalFrameGrid
      .querySelectorAll('.modal-frame-item')
      .forEach(item =>
        item.classList.remove('selected')
      );

    modalSelectedTimes.clear();

    updateModalSelCount();
  }
);

modalConfirm.addEventListener(
  'click',
  async () => {
    if (!modalCurrentSeg) return;

    const seg = modalCurrentSeg;

    const chosenTimes =
      [...modalSelectedTimes]
        .sort((a, b) => a - b);

    closeModal();

    // Remove previously chosen blobs for this segment
    if (
      seg.chosenTimes &&
      seg.chosenTimes.length > 0
    ) {
      extractedBlobs =
        extractedBlobs.filter(
          b => b._segIdx !== seg.segIdx
        );
    }

    seg.chosenTimes = chosenTimes;

    // Re-open the video to capture full-res frames for the chosen times
    if (chosenTimes.length > 0) {
      const url =
        URL.createObjectURL(selectedFile);

      const video =
        document.createElement('video');

      video.src = url;
      video.muted = true;
      video.playsInline = true;
      video.preload = 'metadata';

      await new Promise((res, rej) => {
        video.addEventListener(
          'loadedmetadata',
          res,
          { once: true }
        );

        video.addEventListener(
          'error',
          () => rej(new Error('読み込み失敗')),
          { once: true }
        );

        video.load();
      });

      const W =
        video.videoWidth || 640;

      const H =
        video.videoHeight || 360;

      const oc =
        document.createElement('canvas');

      oc.width = W;
      oc.height = H;

      const octx =
        oc.getContext('2d');

      const newThumbDataURLs = [];

      for (const t of chosenTimes) {
        await seekAndCapture(
          video,
          oc,
          octx,
          t
        );

        const blob =
          await canvasToBlob(
            oc,
            0.92
          );

        const num =
          String(
            extractedBlobs.length + 1
          ).padStart(3, '0');

        const filename =
          `video_seg${String(seg.segIdx).padStart(2, '0')}_${num}_t${t.toFixed(2)}s.jpg`;

        extractedBlobs.push({
          blob,
          filename,
          type: 'video',
          _segIdx: seg.segIdx
        });

        // Capture thumb dataURL too
        const SCALE =
          Math.min(1, 480 / W);

        const tc =
          document.createElement('canvas');

        tc.width =
          Math.round(W * SCALE);

        tc.height =
          Math.round(H * SCALE);

        tc.getContext('2d')
          .drawImage(
            oc,
            0,
            0,
            tc.width,
            tc.height
          );

        newThumbDataURLs.push({
          url: tc.toDataURL(
            'image/jpeg',
            0.45
          ),
          t
        });
      }

      URL.revokeObjectURL(url);

      // Replace placeholder thumbs with one thumb per chosen frame
      // Remove old thumb elements for this segment
      seg.thumbEls.forEach(
        el =>
          el.parentNode &&
          el.parentNode.removeChild(el)
      );

      seg.thumbEls = [];

      // Find insertion point: right after the last thumb currently in grid
      // (we just removed them, so append to end — ordering is handled by DOM order
      //  since stills are already appended; for simplicity append new video thumbs at end)
      for (
        const {
          url: dataURL,
          t
        } of newThumbDataURLs
      ) {
        const div =
          document.createElement('div');

        div.className =
          'thumb-item video-thumb';

        const img =
          document.createElement('img');

        img.src = dataURL;

        const badge =
          document.createElement('div');

        badge.className =
          'thumb-badge badge-video';

        badge.textContent = 'video';

        const lbl =
          document.createElement('div');

        lbl.className =
          'thumb-label';

        lbl.textContent =
          t.toFixed(1) + 's';

        const hint =
          document.createElement('div');

        hint.className =
          'video-edit-hint';

        hint.textContent =
          'タップして再選択';

        div.appendChild(img);
        div.appendChild(badge);
        div.appendChild(lbl);
        div.appendChild(hint);

        div.addEventListener(
          'click',
          () => openModal(seg)
        );

        thumbGrid.appendChild(div);

        seg.thumbEls.push(div);
      }

      // If nothing selected, put back a single placeholder
      if (chosenTimes.length === 0) {
        restorePlaceholderThumb(seg);
      }

    } else {
      // 0 selected — restore placeholder
      seg.thumbEls.forEach(
        el =>
          el.parentNode &&
          el.parentNode.removeChild(el)
      );

      seg.thumbEls = [];

      restorePlaceholderThumb(seg);
    }

    refreshResultStats();
  }
);

function restorePlaceholderThumb(seg) {
  const div =
    document.createElement('div');

  div.className =
    'thumb-item video-thumb';

  // Use first time as preview
  const t =
    seg.times[
      Math.floor(seg.times.length / 2)
    ];

  // We don't have the canvas anymore — just show a dark placeholder with label
  const img =
    document.createElement('img');

  const badge =
    document.createElement('div');

  badge.className =
    'thumb-badge';

  badge.textContent =
    '未選択';

  badge.style.background =
    'rgba(232,160,32,0.25)';

  badge.style.color =
    '#e8a020';

  const lbl =
    document.createElement('div');

  lbl.className =
    'thumb-label';

  lbl.textContent =
    t.toFixed(1) + 's';

  const hint =
    document.createElement('div');

  hint.className =
    'video-edit-hint';

  hint.textContent =
    'タップして選択';

  div.appendChild(img);
  div.appendChild(badge);
  div.appendChild(lbl);
  div.appendChild(hint);

  div.addEventListener(
    'click',
    () => openModal(seg)
  );

  thumbGrid.appendChild(div);

  seg.thumbEls.push(div);
}

// ---- ZIP download ----
dlBtn.addEventListener(
  'click',
  async () => {
    if (extractedBlobs.length === 0) return;

    dlBtn.disabled = true;
    dlBtn.textContent = 'ZIP作成中…';

    try {
      const zip = new JSZip();

      for (
        const {
          blob,
          filename
        } of extractedBlobs
      ) {
        zip.file(
          filename,
          blob
        );
      }

      const content =
        await zip.generateAsync({
          type: 'blob',
          compression: 'STORE'
        });

      const a =
        document.createElement('a');

      a.href =
        URL.createObjectURL(content);

      a.download =
        (
          selectedFile
            ? selectedFile.name.replace(
                /\.[^.]+$/,
                ''
              )
            : 'slides'
        ) +
        '_slides.zip';

      a.click();

      setTimeout(
        () =>
          URL.revokeObjectURL(a.href),
        5000
      );

    } catch (e) {
      showError(
        'ZIP生成エラー: ' +
        e.message
      );

    } finally {
      dlBtn.disabled = false;
      dlBtn.textContent =
        'ZIPでダウンロード';
    }
  }
);
</script>
</body>
</html>
